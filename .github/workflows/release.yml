name: Android App Release Build

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Install official Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.4
          chmod +x gradlew

      - name: Build Android APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Prepare APK for Release
        run: |
          mkdir -p release-apk
          cp app/build/outputs/apk/debug/*.apk release-apk/vynza-music-app-v1.0.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vynza-android-apk
          path: release-apk/*.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          files: release-apk/*.apk
          generate_release_notes: true
          name: "VYNZA Android App v1.0.0"
          body: |
            ### 🎧 VYNZA Android App v1.0.0 Official APK
            
            Welcome to the official release of VYNZA Android Music Streaming App!
            
            - **Download File**: `vynza-music-app-v1.0.0.apk`
            - High-fidelity streaming powered by ExoPlayer
            - Integration with VYNZA Backend API
            
            Download the APK below and install it directly on your Android device.
